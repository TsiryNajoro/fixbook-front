name: Trigger n8n Deployment for fixbook-front

on:
  registry_package:
    types: [published]

concurrency:
  group: deploy-fixbook-front
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.registry_package.package_version.container_metadata.tag.name != ''
    runs-on: self-hosted

    steps:
      - name: Send webhook to n8n
        run: |
          TAG="${{ github.event.registry_package.package_version.container_metadata.tag.name }}"
          REPOSITORY="ghcr.io/${{ github.repository }}"
          IMAGE="${REPOSITORY}:${TAG}"

          echo "Deployment image: $IMAGE"
          echo "Repository: $REPOSITORY"

          curl -X POST http://localhost:5678/webhook/deploy-fixbook \
            -H "Content-Type: application/json" \
            -d "{\"image\":\"$IMAGE\",\"repository\":\"$REPOSITORY\"}"

          echo "Webhook sent to n8n"

